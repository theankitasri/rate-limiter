apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  namespace: rate-limiter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
    spec:
      containers:
        - name: rate-limiter
          image: rate-limiter:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.rate-limiter.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: "redis.rate-limiter.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: RATELIMITER_DEFAULT_LIMIT
              value: "100"
            - name: RATELIMITER_DEFAULT_WINDOW_SECONDS
              value: "60"
            - name: RATELIMITER_ALGORITHM
              value: "SLIDING_WINDOW"
            - name: RATELIMITER_CLIENT
              value: "LETTUCE"
            - name: RATELIMITER_RETRY_AFTER_SECONDS
              value: "30"
            - name: RATELIMITER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rate-limiter-secrets
                  key: jwt-secret
            - name: RATELIMITER_ADMIN_USERS_ADMIN
              valueFrom:
                secretKeyRef:
                  name: rate-limiter-secrets
                  key: admin-password
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  namespace: rate-limiter
spec:
  selector:
    app: rate-limiter
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: NodePort
