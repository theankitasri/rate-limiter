apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: rate-limiter
data:
  redis.conf: |
    # Memory and eviction policy
    maxmemory 256mb
    maxmemory-policy allkeys-lfu

    # Networking
    bind 0.0.0.0
    port 6379
    protected-mode yes

    # Disable persistence (keys are transient rate-limit counters)
    appendonly no
    save ""

    # Logging
    loglevel notice
    logfile ""
