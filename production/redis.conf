# Redis configuration for the distributed rate limiter service.
# Copy to /etc/redis/redis.conf (or your Redis config path) and adjust values
# to your environment before deploying.

# --- Memory & eviction ------------------------------------------------------
# allkeys-lfu: evicts least-frequently-used keys across all databases when
# maxmemory is exceeded. Rate-limiter keys (rate:, sliding:, tokenbucket:)
# all carry short TTLs, so LFU keeps hot client keys while shedding cold ones.
maxmemory 256mb
maxmemory-policy allkeys-lfu

# --- Networking -------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes

# --- Persistence (disable for pure rate-limiter use; keys are transient) ----
appendonly no
save ""

# --- Logging ----------------------------------------------------------------
loglevel notice
logfile /var/log/redis/redis.log

# --- Replication (omit if not using Redis Sentinel/Cluster) -----------------
# slave-read-only yes
